# ============================================================
# 自动部署 — push 到 main → 测试 → 构建 → 部署到 Cloudflare Pages
# ------------------------------------------------------------
# 为什么不用 CF Pages 的 Git 集成:
#   本项目的 Pages 项目 Git 集成已断开(wrangler pages project list 显示
#   Git Provider = No),push 后 CF 连仓库都克隆不到,构建几秒内瞬间失败,
#   线上不更新(2026-11 排查确认,非代码问题)。
#   本 workflow 走「Direct Upload」路线:CI 自己构建,再用 wrangler 传上去,
#   完全不依赖面板里的 Git 集成。
#
# 需要的仓库 secrets(GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — CF 账号的 API token(有 Pages:Edit / D1:Edit 即可)
#   CLOUDFLARE_ACCOUNT_ID — CF 账号 id
#
# ⚠️ secrets 没配时,「部署」那一步会被跳过(不报错),站点仍可手动发布。
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ 不要在 job 级 if 里判断 secrets:secrets 上下文在 jobs.<job_id>.if
    #    里不可用,GitHub 会直接报「Unrecognized named-value: 'secrets'」,
    #    整个 workflow 秒挂(2026-11 实测:手动 Run workflow 也是 1 秒失败)。
    #    「密钥没配就跳过」改成在 deploy 这一步用 env 间接判断(见下)。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # src/generated/ 是构建产物(已 gitignore),typecheck 前必须先生成
      - name: Generate content (src/generated)
        run: npm run build:posts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # 密钥没配时跳过这一步(前面的检查/测试/构建照跑,不会红);
        # env 上下文在 step 级 if 里可用,secrets 直接出现在 if 里则不行。
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name vshowcase \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}"
